# Nginx site config example — save to /etc/nginx/sites-available/atlas
# (or /etc/nginx/conf.d/atlas.conf on some distros), then:
#   sudo ln -s /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;   # <-- replace with your domain

    # uploads & static assets: cache aggressively, serve via backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;      # allow cover uploads up to 8 MB
    }
}

# After HTTPS is enabled with certbot (sudo certbot --nginx), certbot rewrites
# this file to add listen 443 ssl + a redirect from 80.
